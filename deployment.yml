                    "containerPort": 27017
                  }
                ],
                "env": [],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                }
              }
            ]
          }
        }
      }
